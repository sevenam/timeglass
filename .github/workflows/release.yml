name: Release

# Pushing a v* tag (#38) runs the full CI suite, then creates a GitHub Release with the installer,
# the zipped single-file build, their SHA-256 files and notes generated from the merged PRs.
#
# The release is also the update feed (#40): installed copies read its releases.win.json and
# download the .nupkg files next to it (the full package, or the delta from the release before).
# Don't rename or remove those assets, and publish the release (a draft is not seen).
#
#   git tag v0.1.0
#   git push origin v0.1.0
#
# A tag with a pre-release part, such as v0.2.0-beta.1, makes a pre-release.

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    # What ci.yml's jobs need: test reports are check runs.
    permissions:
      contents: read
      checks: write
      pull-requests: write

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: write
    steps:
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: timeglass-win-x64
          path: package

      - name: Check the package
        id: check
        run: |
          version="${GITHUB_REF_NAME#v}"
          zip="package/timeglass-${version}-win-x64.zip"
          # The exe's version comes from the tag (MinVer), so the name says whether they agree.
          if [[ ! -f "$zip" ]]; then
            echo "::error::Expected $zip for tag $GITHUB_REF_NAME, found: $(ls package)"
            exit 1
          fi
          setup="package/timeglass-${version}-win-x64-setup.exe"
          full="sevenam.Timeglass-${version}-full.nupkg"
          for file in "$setup" "package/$full" package/releases.win.json; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Expected $file for tag $GITHUB_REF_NAME, found: $(ls package)"
              exit 1
            fi
          done
          # The feed must offer this version, or installed copies never see the release.
          if ! grep -qF "\"$full\"" package/releases.win.json; then
            echo "::error::releases.win.json does not list $full"
            exit 1
          fi
          (cd package && sha256sum -c "$(basename "$zip").sha256" "$(basename "$setup").sha256")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" package/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Timeglass $VERSION" \
            --generate-notes \
            "${prerelease[@]}" \
            --notes "Download and run \`timeglass-$VERSION-win-x64-setup.exe\`. It installs for your user only, without admin rights, and Timeglass keeps itself up to date from then on. If it is already installed, it picks this version up by itself.

          Prefer no install? \`timeglass-$VERSION-win-x64.zip\` holds a single \`Timeglass.exe\` that runs from any folder and does not update itself. Neither needs a .NET runtime. The \`.nupkg\` files and \`releases.win.json\` are for the updater.

          The build isn't code-signed yet, so Windows SmartScreen warns the first time you run it: choose **More info**, then **Run anyway**. To check a download, compare \`Get-FileHash\` of the file with its \`.sha256\` file."
