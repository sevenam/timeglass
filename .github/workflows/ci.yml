name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow (#38) runs the whole suite first, then publishes this run's package.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  dotnet-portable:
    name: .NET (Linux, portable projects)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Timeglass.Portable.slnx

      - name: Check formatting
        run: dotnet format Timeglass.Portable.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Timeglass.Portable.slnx -c Release --no-restore

      - name: Test
        id: test
        run: >
          dotnet test Timeglass.Portable.slnx -c Release --no-build
          --logger "trx" --results-directory TestResults
          --collect "XPlat Code Coverage" --settings coverage.runsettings

      - name: Test report
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        uses: dorny/test-reporter@v3
        with:
          name: Tests (Linux)
          path: TestResults/**/*.trx
          reporter: dotnet-trx
          fail-on-empty: true

      - name: Upload test results
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-linux
          path: TestResults

      # Coverage (#5): merge the per-project Cobertura files, show them on the job
      # summary and the PR, and fail when an assembly drops below its threshold.
      # Timeglass.Windows and Timeglass.App are not in the portable solution and
      # have no threshold: they are thin adapters covered by integration tests.
      - name: Merge coverage
        id: coverage
        if: ${{ !cancelled() && steps.test.outcome == 'success' }}
        run: |
          dotnet tool restore
          dotnet reportgenerator \
            "-reports:TestResults/**/coverage.cobertura.xml" \
            "-targetdir:coverage" \
            "-reporttypes:Cobertura;MarkdownSummaryGithub;Html"
          cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-dotnet
          path: coverage

      - name: Comment coverage on PR
        # Fork and Dependabot PRs get a read-only token, so they only get the job summary.
        if: >-
          ${{ !cancelled() && steps.coverage.outcome == 'success'
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]' }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- timeglass-coverage-dotnet -->';
            const body = `${marker}\n${fs.readFileSync('coverage/SummaryGithub.md', 'utf8')}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.user.type === 'Bot' && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Check coverage thresholds
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        run: >
          python3 build/check-coverage.py coverage/Cobertura.xml
          Timeglass.Core=90
          Timeglass.Storage=80
          Timeglass.Api=80

  dotnet-windows:
    name: .NET (Windows, full solution)
    runs-on: windows-latest
    # The tray app embeds the dashboard (#30); it reuses the web job's build instead of
    # running npm again.
    needs: web
    # Backstop for a hung desktop test; each test also has its own timeout (#19).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Download web build
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist

      - name: Restore
        run: dotnet restore Timeglass.slnx

      - name: Build
        id: build
        run: dotnet build Timeglass.slnx -c Release --no-restore -p:TimeglassBuildWeb=false

      - name: Test
        id: test
        run: >
          dotnet test Timeglass.slnx -c Release --no-build
          --filter "Category!=WindowsIntegration"
          --logger "trx" --results-directory TestResults/unit

      # Tests against real Win32 APIs and real windows on the runner's desktop (#19).
      # A hang dump is taken and the run aborted if one test stalls past the blame timeout.
      # If these turn out flaky on hosted runners, move them to a nightly workflow rather
      # than adding retries.
      - name: Windows integration tests
        id: integration
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >
          dotnet test Timeglass.slnx -c Release --no-build
          --filter "Category=WindowsIntegration"
          --blame-hang-timeout 2m
          --logger "trx" --results-directory TestResults/integration

      - name: Test report
        if: ${{ !cancelled() && (steps.test.outcome != 'skipped' || steps.integration.outcome != 'skipped') }}
        uses: dorny/test-reporter@v3
        with:
          name: Tests (Windows)
          path: TestResults/**/*.trx
          reporter: dotnet-trx
          fail-on-empty: true

      - name: Upload test results
        if: ${{ !cancelled() && (steps.test.outcome != 'skipped' || steps.integration.outcome != 'skipped') }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows
          path: TestResults

  web:
    name: Web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # The client's types are generated from the API's openapi.json (#31).
      - name: Check generated API types
        run: npm run check:api

      - name: Typecheck
        run: npm run typecheck

      # Fails when line coverage of web/src drops below the threshold in vite.config.ts (#5).
      - name: Test
        id: test
        run: npm run test:coverage

      - name: Coverage summary
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' && hashFiles('web/coverage/coverage-summary.json') != '' }}
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: npm run build

      - name: Upload web build
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  # End-to-end tests (#37): the built dashboard against the dev host, with the clock stopped so
  # the demo data is the same on every run. Runs once the units are green.
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [web, dotnet-portable]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Download web build
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist

      # Built up front so the test run's start-up timeout only covers starting it.
      - name: Build dev host
        run: dotnet build ../tools/Timeglass.DevHost -c Release

      - name: Test
        id: test
        run: npm run e2e

      # Traces open with `npx playwright show-trace <trace.zip>` or at trace.playwright.dev.
      - name: Upload traces and report
        if: ${{ failure() && steps.test.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/test-results
            web/playwright-report
          retention-days: 14

  # The release build (#38): Timeglass.exe as one self-contained file with the dashboard embedded,
  # zipped with its SHA-256, and the installer with its update packages (#40). It is built on every
  # run so a change that breaks publishing fails here; the release workflow attaches this artifact
  # to the GitHub Release, and each main build keeps it as a nightly-style download.
  package:
    name: Package (win-x64)
    runs-on: windows-latest
    needs: web
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # MinVer versions the build from the latest v* tag and the commits since.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Download web build
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist

      - name: Publish
        run: >
          dotnet publish src/Timeglass.App/Timeglass.App.csproj -c Release
          -r win-x64 --self-contained -p:PublishSingleFile=true
          -p:TimeglassBuildWeb=false -o publish

      - name: Zip
        id: zip
        shell: pwsh
        run: |
          $files = @(Get-ChildItem publish)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'Timeglass.exe') {
            throw "Expected publish/ to hold Timeglass.exe only, found: $($files.Name -join ', ')"
          }

          # The version stamped into the exe, as the About box shows it, without the commit.
          $version = (Get-Item publish/Timeglass.exe).VersionInfo.ProductVersion -replace '\+.*$', ''
          $name = "timeglass-$version-win-x64.zip"
          New-Item -ItemType Directory -Force package | Out-Null
          Compress-Archive -Path publish/Timeglass.exe -DestinationPath "package/$name"

          # sha256sum format, so `sha256sum -c` works on it.
          $hash = (Get-FileHash "package/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "package/$name.sha256" -Value "$hash  $name" -NoNewline -Encoding ascii

          "version=$version" >> $env:GITHUB_OUTPUT
          "### Package`n`n``$name`` ($version)`n`nSHA-256 ``$hash``" >> $env:GITHUB_STEP_SUMMARY

      # The installer (#40) is built from a second publish with one file per assembly: an update
      # then only downloads the assemblies that changed (a delta), which a single compressed exe
      # would hide. Symbols are embedded here too, so stack traces keep their line numbers.
      - name: Publish for the installer
        run: >
          dotnet publish src/Timeglass.App/Timeglass.App.csproj -c Release
          -r win-x64 --self-contained -p:DebugType=embedded
          -p:TimeglassBuildWeb=false -o publish-installer

      # vpk, pinned in dotnet-tools.json to the version of the Velopack package the app uses.
      - name: Restore tools
        run: dotnet tool restore

      # A delta is the difference to the release before, so a release build fetches that one.
      # Other builds are never published and skip it. Without a delta an update still works; it
      # downloads the full package.
      - name: Download the previous release
        if: ${{ github.ref_type == 'tag' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.zip.outputs.version }}
        run: |
          $vpk = @('download', 'github', '--repoUrl', "https://github.com/$env:GITHUB_REPOSITORY",
            '--token', $env:GH_TOKEN, '--outputDir', 'releases')
          if ($env:VERSION -match '-') { $vpk += '--pre' }

          # Succeeds with nothing downloaded when there is no release yet (the first one).
          dotnet vpk @vpk
          if ($LASTEXITCODE -ne 0) { throw "vpk download failed ($LASTEXITCODE)" }
          if (-not (Test-Path releases/*-full.nupkg)) {
            "::notice::No previous release to build a delta from; this release has the full package only."
          }

      # Makes the setup exe, the full update package, the delta if there is a previous release and
      # the feed (releases.win.json) the app reads from the GitHub Release. The package id is the
      # install folder under %LOCALAPPDATA% and must stay the same for updates to be found; it is
      # InstalledApp.PackageId in the app.
      - name: Pack the installer
        shell: pwsh
        env:
          VERSION: ${{ steps.zip.outputs.version }}
        run: |
          $id = 'sevenam.Timeglass'
          dotnet vpk pack --packId $id --packVersion $env:VERSION --runtime win-x64 `
            --packDir publish-installer --mainExe Timeglass.exe `
            --packTitle Timeglass --packAuthors sevenam `
            --icon src/Timeglass.App/Assets/timeglass.ico `
            --shortcuts StartMenuRoot --noPortable --outputDir releases
          if ($LASTEXITCODE -ne 0) { throw "vpk pack failed ($LASTEXITCODE)" }

          # Only this version's files go into the release; releases/ may also hold the previous one.
          $setup = "timeglass-$env:VERSION-win-x64-setup.exe"
          Copy-Item "releases/$id-win-Setup.exe" "package/$setup"
          Copy-Item "releases/$id-$env:VERSION-full.nupkg" package/
          Copy-Item releases/releases.win.json package/
          $delta = "releases/$id-$env:VERSION-delta.nupkg"
          if (Test-Path $delta) { Copy-Item $delta package/ }

          $hash = (Get-FileHash "package/$setup" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "package/$setup.sha256" -Value "$hash  $setup" -NoNewline -Encoding ascii

          $files = Get-ChildItem package | ForEach-Object { "- ``$($_.Name)`` ($([math]::Round($_.Length / 1MB, 1)) MB)" }
          "### Installer`n`n$($files -join "`n")`n`nSHA-256 of the setup exe ``$hash``" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: timeglass-win-x64
          path: package
          if-no-files-found: error
          # The zip is already compressed.
          compression-level: 0
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}
